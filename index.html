<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>রেজাল্ট ম্যানেজমেন্ট সিস্টেম</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1c4a34">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="রেজাল্ট সিস্টেম">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --ink:#1c2521;
    --paper:#f7f5ef;
    --line:#d8d2c4;
    --accent:#2f6f4e;
    --accent-dark:#1c4a34;
    --gold:#c79a4b;
    --maroon:#7a2e2e;
    --danger:#a4392f;
    --muted:#6b6459;
    --card:#ffffff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Noto Sans Bengali','SolaimanLipi',Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
  }
  .app{max-width:980px;margin:0 auto;padding:24px 18px 80px;}
  header.top{
    display:flex;justify-content:space-between;align-items:center;
    border-bottom:3px solid var(--gold);
    padding-bottom:16px;margin-bottom:24px;flex-wrap:wrap;gap:14px;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-logo{width:52px;height:52px;object-fit:contain;flex-shrink:0;}
  .brand-text{display:flex;flex-direction:column;gap:2px;}
  .brand input{
    font-size:21px;font-weight:700;border:none;background:transparent;
    color:var(--accent-dark);padding:2px 0;width:100%;letter-spacing:.2px;
  }
  .brand small{color:var(--muted);}
  nav.tabs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  nav.tabs button{
    display:inline-flex;align-items:center;gap:7px;
    border:1.5px solid var(--line);background:var(--card);
    padding:9px 16px;border-radius:24px;cursor:pointer;font-size:14px;
    color:var(--ink);font-weight:600;transition:background .15s,border-color .15s;
  }
  nav.tabs button svg{flex-shrink:0;}
  nav.tabs button:hover{border-color:var(--accent);}
  nav.tabs button.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  nav.tabs button#teacherLoginBtn{border-color:var(--maroon);color:var(--maroon);}
  nav.tabs button#teacherLoginBtn:hover{background:var(--maroon);color:#fff;}
  nav.tabs button.secondary{background:transparent;border-color:var(--line);color:var(--muted);}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:20px;margin-bottom:18px;
  }
  h2{margin:0 0 14px;font-size:19px;color:var(--accent-dark);}
  .hero{
    background:linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
    border:none;color:#fff;padding:32px 28px;text-align:center;
  }
  .hero-logo{width:64px;height:64px;object-fit:contain;margin:0 auto 14px;display:block;}
  .hero h2{color:#fff;font-size:22px;margin-bottom:10px;}
  .hero p{color:rgba(255,255,255,.9);max-width:560px;margin:0 auto;}
  .hero .row-actions{justify-content:center;margin-top:22px;}
  .hero .btn{background:#fff;color:var(--accent-dark);font-weight:700;}
  .hero .btn:hover{background:#f0ede4;}
  .hero .btn.secondary{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.6);}
  .hero .btn.secondary:hover{background:rgba(255,255,255,.12);}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  @media (max-width:640px){.grid,.grid3{grid-template-columns:1fr;}}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:600;}
  input[type=text],input[type=number],input[type=date],select{
    width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;
    font-size:15px;background:#fff;color:var(--ink);font-family:inherit;
  }
  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .field{margin-bottom:14px;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;justify-content:center;
    background:var(--accent);color:#fff;border:none;padding:11px 20px;
    border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;
  }
  .btn svg{flex-shrink:0;}
  .btn:hover{background:var(--accent-dark);}
  .btn.secondary{background:#fff;color:var(--accent-dark);border:1.5px solid var(--accent);}
  .btn.secondary:hover{background:#eef5f0;}
  .btn.small{padding:6px 12px;font-size:13px;}
  .btn.danger{background:var(--danger);}
  .btn.danger:hover{background:#832a22;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  table{width:100%;border-collapse:collapse;margin-top:6px;}
  th,td{border:1px solid var(--line);padding:9px 10px;text-align:left;font-size:14px;}
  th{background:#eef1ec;color:var(--accent-dark);font-weight:700;}
  tr:nth-child(even) td{background:#fafaf7;}
  td input[type=number]{width:90px;padding:6px 8px;}
  td input[type=text]{padding:6px 8px;}
  .rank-cell{font-weight:700;color:var(--accent-dark);}
  .absent{color:var(--muted);font-style:italic;}

  .muted{color:var(--muted);font-size:13px;}
  .row-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
  .empty{
    text-align:center;padding:40px 10px;color:var(--muted);border:1.5px dashed var(--line);
    border-radius:10px;
  }
  .date-folder{
    border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden;background:#fbfaf6;
  }
  .date-folder summary{
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
    padding:12px 14px;cursor:pointer;font-size:14.5px;color:var(--accent-dark);font-weight:600;
    background:#eef1ec;list-style:none;
  }
  .date-folder summary::-webkit-details-marker{display:none;}
  .date-folder summary::before{content:"▸ ";}
  .date-folder[open] summary::before{content:"▾ ";}
  .folder-body{padding:12px 14px;}
  .exam-list-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 14px;border:1px solid var(--line);border-radius:9px;margin-bottom:9px;
    background:#fff;cursor:pointer;
  }
  .exam-list-item:hover{border-color:var(--accent);}
  .exam-list-item .meta{font-size:13px;color:var(--muted);margin-top:2px;}
  .tag{
    display:inline-block;background:#eef1ec;color:var(--accent-dark);
    font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:20px;margin-right:6px;
  }
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--accent-dark);color:#fff;padding:11px 20px;border-radius:8px;
    font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.2);z-index:120;
  }
  .print-sheet{display:none;}

  @media print{
    body *{visibility:hidden;}
    .print-sheet,.print-sheet *{visibility:visible;}
    .print-sheet{display:block !important;position:absolute;top:0;left:0;width:100%;padding:20px;}
  }
  .ps-header-row{display:flex;align-items:center;gap:14px;border-bottom:3px solid #000;padding-bottom:10px;margin-bottom:14px;}
  .ps-logo{width:78px;height:78px;object-fit:contain;flex-shrink:0;}
  .ps-logo-spacer{width:78px;flex-shrink:0;}
  .ps-titleblock{flex:1;text-align:center;}
  .ps-titleblock h1{margin:0;font-size:30px;letter-spacing:.5px;}
  .ps-titleblock p{margin:6px 0 0;color:#222;font-size:15px;}
  .ps-meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 24px;margin-bottom:16px;font-size:14px;}
  .ps-meta span b{color:#000;font-weight:700;}
  .ps-table{width:100%;border-collapse:collapse;}
  .ps-table th,.ps-table td{border:1px solid #333;padding:9px 10px;font-size:15px;text-align:center;}
  .ps-table th{background:#eee;font-weight:700;}
  .ps-table td.ps-name{text-align:left;}
  .ps-table td.ps-top{font-size:34px;font-weight:700;vertical-align:middle;}
  .ps-footer{display:flex;justify-content:flex-end;margin-top:40px;font-size:13px;}
  .ps-footer .sig{width:220px;text-align:center;}
  .ps-sign{display:block;height:42px;object-fit:contain;margin:0 auto 4px;}
  /* Force every bit of text on the printed sheet to pure black — near-black greys print faint/faded on laser printers */
  .print-sheet, .print-sheet *{color:#000 !important;}
  .ps-table td, .ps-table th{font-weight:600;}
  .sig-line{border-top:1px solid #333;padding-top:6px;}

  /* ---- login / password / certificate-scope dialogs ---- */
  input[type=password]{
    width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;
    font-size:15px;background:#fff;color:var(--ink);font-family:inherit;
  }
  input[type=password]:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .modal-back{
    position:fixed;inset:0;background:rgba(20,26,22,.55);z-index:90;
    display:flex;align-items:center;justify-content:center;padding:16px;
  }
  .modal{
    background:#fff;border-radius:14px;padding:22px;width:100%;max-width:420px;
    max-height:92vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.3);
  }
  .modal h3{margin:0 0 6px;font-size:18px;color:var(--accent-dark);}
  .modal p.muted{margin:0 0 14px;line-height:1.6;}
  .modal-msg{min-height:20px;color:var(--danger);font-size:13.5px;margin:-4px 0 8px;font-weight:600;}
  .role-pick{display:flex;gap:8px;margin:12px 0 16px;}
  .role-pick button{
    flex:1;padding:10px 8px;border:1.5px solid var(--line);background:#fff;border-radius:10px;
    font-size:15px;font-weight:700;color:var(--ink);cursor:pointer;font-family:inherit;
  }
  .role-pick button.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .role-pick button[data-role=admin].on{background:var(--maroon);border-color:var(--maroon);}
  .role-badge{
    display:inline-flex;align-items:center;padding:6px 12px;border-radius:20px;
    font-size:13px;font-weight:700;color:#fff;background:var(--accent);
  }
  .role-badge.admin{background:var(--maroon);}
  .mt-status{margin:10px 0 14px;padding:10px 14px;border-radius:10px;font-size:13.5px;line-height:1.7;}
  .mt-status.draft{background:#fff6e0;border:1px solid #e3c36b;color:#6b4e00;}
  .mt-status.ok{background:#e9f4ee;border:1px solid #a9d3bb;color:var(--accent-dark);font-weight:700;}
  .mt-tag{display:inline-block;margin-left:6px;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:700;vertical-align:middle;}
  .mt-tag.ok{background:#e9f4ee;color:var(--accent-dark);}
  .mt-tag.draft{background:#fff0c9;color:#7a5600;}
  .cert-overlay{position:fixed;inset:0;z-index:100;background:#fff;display:flex;flex-direction:column;}
  .cert-bar{
    display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:3px solid var(--gold);
    background:var(--paper);flex-shrink:0;
  }
  .cert-bar b{color:var(--accent-dark);font-size:16px;}
  .cert-overlay iframe{flex:1;width:100%;border:0;background:#fff;}
</style>
</head>

<div id="toastHost"></div>
<div class="print-sheet" id="pdfSheet"></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbz9ydabHjHQ6X0BbZKoUsMvF1G6q29XJF8SGfa9EePFXKdxnnMAZAkRF7Vp_cU7kQPHeg/exec";

const STORE = {
  async get(key, shared){
    const res = await fetch(`${API_URL}?action=get&key=${encodeURIComponent(key)}`);
    if(!res.ok) throw new Error('network error on get');
    const data = await res.json();
    if(!data.found) throw new Error('key not found');
    return { key: data.key, value: data.value, shared: !!shared };
  },
  async set(key, value, shared){
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'set', key, value })
    });
    if(!res.ok) throw new Error('network error on set');
    const data = await res.json();
    if(!data.success) throw new Error('save failed');
    return { key, value, shared: !!shared };
  },
  async delete(key, shared){
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'delete', key })
    });
    if(!res.ok) throw new Error('network error on delete');
    const data = await res.json();
    if(!data.success) throw new Error('delete failed');
    return { key, deleted:true, shared: !!shared };
  },
  async list(prefix, shared){
    const res = await fetch(`${API_URL}?action=list&prefix=${encodeURIComponent(prefix||'')}`);
    if(!res.ok) throw new Error('network error on list');
    const data = await res.json();
    return { keys: data.keys || [], prefix, shared: !!shared };
  }
};

// Navigates to a view AND records it in browser history, so the phone/browser back button
// moves between the app's own screens instead of leaving the app entirely (which was the
// original bug — this app manages everything in-memory, so without pushState/popstate the
// back button had nothing of ours to go back to).
function navigateTo(view, opts){
  opts = opts || {};
  VIEW = view;
  if(opts.exam) currentExam = opts.exam;
  const state = { view, examId: (view === 'result' && currentExam) ? currentExam.id : null };
  history.pushState(state, '', '#'+view);
  render();
}

window.addEventListener('popstate', async (e)=>{
  // phone/browser back button while the certificate generator is open → just close it
  if(document.getElementById('certOverlay')){ closeCertificateOverlay(); return; }
  const state = e.state || { view: 'home' };
  VIEW = state.view;
  if(VIEW === 'result' && state.examId && (!currentExam || currentExam.id !== state.examId)){
    const data = await getExam(state.examId);
    if(data) currentExam = data;
  }
  render();
});

// ---- Filename transliteration (Bengali → English), used ONLY for downloaded file names ----
// The printed/PDF content always stays in Bengali — this only affects what the saved file is called,
// since Bengali-script filenames render as garbled boxes on many systems/USB drives.
const BN_TO_EN_WORDS = {
  'শ্রেণি':'Class','শ্রেণী':'Class','শ্রেনী':'Class','শাখা':'Section','ব্যাচ':'Batch',
  'সাপ্তাহিক পরীক্ষা':'Weekly-Exam','এক্সাম ব্যাচ':'Exam-Batch','বৃত্তি ব্যাচ':'Scholarship-Batch',
  'ভর্তি প্রিপারেশন ব্যাচ':'Admission-Prep-Batch','ক্লাসটেস্ট':'Class-Test','ক্লাস টেস্ট':'Class-Test',
  'সকাল':'Morning','বিকাল':'Afternoon','বিকেল':'Afternoon','সন্ধ্যা':'Evening','দুপুর':'Noon','রাত':'Night',
  '১ম':'1st','২য়':'2nd','৩য়':'3rd','৪র্থ':'4th','৫ম':'5th','৬ষ্ঠ':'6th','৭ম':'7th','৮ম':'8th','৯ম':'9th','১০ম':'10th',
  // common subject names, so these don't fall back to a generic placeholder in filenames
  'বাংলা':'Bangla','ইংরেজি':'English','গণিত':'Math','বিজ্ঞান':'Science','ধর্ম':'Religion',
  'সমাজ':'Social','আরবি':'Arabic','ইসলাম':'Islamiyat','কম্পিউটার':'Computer','সাধারণ জ্ঞান':'GK'
};
// standalone section-letter mapping (Bengali consonant order → A, B, C, ...) — only applied when
// the letter stands alone (e.g. "ক" or "(ক)" as a section name), never mid-word, see below.
const BN_LETTER_MAP = {
  'ক':'A','খ':'B','গ':'C','ঘ':'D','ঙ':'E','চ':'F','ছ':'G','জ':'H','ঝ':'I','ঞ':'J',
  'ট':'K','ঠ':'L','ড':'M','ঢ':'N','ণ':'O','ত':'P','থ':'Q','দ':'R','ধ':'S','ন':'T',
  'প':'U','ফ':'V','ব':'W','ভ':'X','ম':'Y','য':'Z'
};
const BN_DIGIT_TO_EN = {'০':'0','১':'1','২':'2','৩':'3','৪':'4','৫':'5','৬':'6','৭':'7','৮':'8','৯':'9'};

function transliterateForFilename(str){
  if(!str) return '';
  let s = str;
  // longer phrases first so e.g. "এক্সাম ব্যাচ" matches before a lone "ব্যাচ" would
  const wordEntries = Object.entries(BN_TO_EN_WORDS).sort((a,b)=> b[0].length - a[0].length);
  wordEntries.forEach(([bn,en])=>{ s = s.split(bn).join(en); });
  // standalone single-consonant section letters only — the letter must be bounded by start/end
  // of string, whitespace, a hyphen, or parentheses on BOTH sides, so it never matches a
  // consonant that's actually part of a longer, untranslated Bengali word (e.g. the জ inside
  // ইংরেজি must NOT become "H" — it's just one letter of a real word, not a section label).
  s = s.replace(/(^|[\s\(\-])([ক-য])(?=[\s\)\-]|$)/g, (m, pre, ch) => pre + (BN_LETTER_MAP[ch] || ch));
  // Bengali digits — safe to convert anywhere, digits are never ambiguous like consonants are
  s = s.replace(/[০-৯]/g, d => BN_DIGIT_TO_EN[d]);
  // anything Bengali still left over (words with no translation entry, vowel signs, etc.) —
  // drop it rather than leave broken/garbled bytes in a filename
  s = s.replace(/[\u0980-\u09FF]/g, '');
  // tidy up leftover double spaces/hyphens from removed characters
  s = s.replace(/\s+/g,' ').trim();
  return s;
}
function filenameSafe(str){ return sanitizeKey(transliterateForFilename(str)) || 'file'; }

async function loadSettings(){
  try{
    const r = await STORE.get('settings', true);
    if(r && r.value){
      const loaded = JSON.parse(r.value);
      SETTINGS = Object.assign({ centerName:"আমার কোচিং সেন্টার", teacherPin:"", deletePin:"" }, loaded);
      // migrate from the old single-PIN system: the old "adminPin" becomes the new teacherPin
      // (delete gets its own separate PIN going forward, set the first time someone deletes something)
      if(loaded.adminPin && !loaded.teacherPin){
        SETTINGS.teacherPin = loaded.adminPin;
        delete SETTINGS.adminPin;
        await saveSettings();
      }
    }
  }catch(e){ /* not set yet */ }
}
async function saveSettings(){
  try{ await STORE.set('settings', JSON.stringify(SETTINGS), true); }catch(e){ console.error(e); }
}

// ROLES — exactly two:
//   "teacher" → ONE shared password for all teachers: create / edit results, enter Model Test marks
//   "admin"   → the owner's own password: everything a teacher can do, PLUS deleting results,
//               the certificate generator, and changing the passwords
//
// Storage: SETTINGS.teacherPin = teacher password, SETTINGS.deletePin = admin password.
// (The field names are kept from the older versions so passwords that are already saved keep working —
//  the old "delete PIN" simply became the admin password.)
// Login is session-only: reloading/reopening the page logs out, same as before.
// ============================================================================
let ROLE = null; // null | 'teacher' | 'admin'
function isLoggedIn(){ return ROLE === 'teacher' || ROLE === 'admin'; }
function isAdmin(){ return ROLE === 'admin'; }
function setRole(r){
  ROLE = r;
  // the certificate page (a separate file) reads this to know whether an admin is logged in
  try{ if(r) sessionStorage.setItem('rs.role', r); else sessionStorage.removeItem('rs.role'); }catch(e){}
}
function logout(){ setRole(null); }

// Small reusable dialog. `setup(root, close)` wires the buttons; close(value) resolves the promise.
function openModal(innerHtml, setup){
  return new Promise(resolve=>{
    const back = el(`<div class="modal-back"><div class="modal" role="dialog" aria-modal="true">${innerHtml}</div></div>`);
    const onKey = (e)=>{ if(e.key === 'Escape') close(null); };
    const close = (val)=>{ document.removeEventListener('keydown', onKey); back.remove(); resolve(val); };
    back.addEventListener('mousedown', (e)=>{ if(e.target === back) close(null); });
    document.addEventListener('keydown', onKey);
    document.body.appendChild(back);
    setup(back.querySelector('.modal'), close);
  });
}

        try{ await loadSettings(); }catch(e){}

    }

    root.querySelectorAll('input').forEach(i=> i.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') submit(); }));
    paint();

function datalistOptions(arr){

async function saveExam(exam){
  let id;
  if(exam.id){
    // Editing an existing record: keep the original creation-timestamp suffix (for uniqueness)
    // but rebuild the rest of the id from the CURRENT values — otherwise correcting a date (or
    // class/subject/exam-type) during an edit wouldn't move the record into the right date
    // folder; it would silently stay filed under the old values. "__" (double underscore) is
    // used as the segment separator for the newer 5-part id format (adds exam type); older
    // records saved before this feature used a single "_" with 4 parts — both are handled below.
    const ts = exam.id.includes('__') ? exam.id.split('__').pop() : exam.id.split('_').pop();
    const newId = `${exam.classKey}__${sanitizeKey(exam.examType||'')}__${sanitizeKey(exam.subject)}__${exam.date}__${ts}`;
    if(newId !== exam.id){
      try{ await STORE.delete('exam:'+exam.id, true); }catch(e){ /* old key may already be gone — fine */ }
      id = newId;
    } else {
      id = exam.id;
    }
  } else {
    id = `${exam.classKey}__${sanitizeKey(exam.examType||'')}__${sanitizeKey(exam.subject)}__${exam.date}__${Date.now()}`;
  }
  exam.id = id;
  try{
    await STORE.set('exam:'+id, JSON.stringify(exam), true);
    await updateFormMeta(exam);
    return true;
  }catch(e){ console.error(e); return false; }
}

}

// dense ranking: equal marks -> equal rank; next distinct mark gets the very next rank number (no skipping)
// input: array of {name, mark}  (mark may be null/undefined/"" for absent)
function computeRanking(entryList){
  const present = entryList.filter(e => e.mark !== null && e.mark !== undefined && e.mark !== "" && e.name.trim()!=='');
  const absent = entryList.filter(e => (e.mark === null || e.mark === undefined || e.mark === "") && e.name.trim()!=='');
  present.sort((a,b)=> Number(b.mark) - Number(a.mark));
  let ranked = [];
  let prevMark = null, rankCounter = 0;
  present.forEach((e)=>{
    const numMark = Number(e.mark);
    if(prevMark === null || numMark !== prevMark){
      rankCounter += 1;
    }
    ranked.push({name:e.name, mark:numMark, rank:rankCounter});
    prevMark = numMark;
  });
  absent.forEach(e=> ranked.push({name:e.name, mark:null, rank:null}));
  ranked.sort((a,b)=>{
    if(a.rank===null && b.rank===null) return a.name.localeCompare(b.name,'bn');
    if(a.rank===null) return 1;
    if(b.rank===null) return -1;
    return a.rank - b.rank;
  });
  return ranked;
}

// ---- Bengali numeral / ordinal helpers ----
const BN_DIGITS = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
function toBnDigits(input){
  return String(input).replace(/[0-9]/g, d => BN_DIGITS[d]);
}
const BN_ORDINAL_SUFFIX = {1:'ম',2:'য়',3:'য়',4:'র্থ',5:'ম',6:'ষ্ঠ',7:'ম',8:'ম',9:'ম',10:'ম'};
function toBnOrdinal(n){
  if(n===null || n===undefined) return '-';
  if(n<=10) return toBnDigits(n)+BN_ORDINAL_SUFFIX[n];
  return toBnDigits(n)+'তম';
}

      </table>
      <div class="row-actions">
        <button class="btn secondary small" id="addRow">+ শিক্ষার্থী যোগ করুন</button>
      </div>
      <div class="row-actions" style="margin-top:20px;">
        <button class="btn secondary" id="backMeta">← পেছনে যান</button>
        <button class="btn" id="submitExam">${ex.editing ? 'রেজাল্ট আপডেট করুন' : 'রেজাল্ট সাবমিট করুন'}</button>

function collectMetaForm(root){
  const ex = currentExam;
  ex.examType = root.querySelector('#f_examtype').value.trim();
  ex.teacher = root.querySelector('#f_teacher').value.trim();
  ex.subject = root.querySelector('#f_subject').value.trim();
  ex.cls = root.querySelector('#f_class').value.trim();
  ex.section = root.querySelector('#f_section').value.trim();
  ex.batch = root.querySelector('#f_batch').value.trim();
  ex.date = root.querySelector('#f_date').value;
  ex.fullMarks = Number(root.querySelector('#f_full').value) || 100;
}

async function goToStudentsStep(){
  const ex = currentExam;
  if(!ex.examType || !ex.teacher || !ex.subject || !ex.cls || !ex.batch || !ex.date){
    showToast('অনুগ্রহ করে * চিহ্নিত ঘরগুলো পূরণ করুন');
    return;
  }
  ex.classKey = sanitizeKey(`${ex.cls}-${ex.section}-${ex.batch}`);
  if(ex.editing && ex.entries && ex.entries.length){
    // editing an existing result — keep its already-loaded names/marks, don't overwrite from the master list
    ex.step = 'students';
    render();
    return;
  }
  const existing = await getStudents(ex.classKey);
  ex.entries = existing.length ? existing.map(n=>({name:n, mark:null})) : [];
  ex.step = 'students';
  render();
}

function attachEntryEvents(root){
  const toStudents = root.querySelector('#toStudents');
  if(toStudents){
    toStudents.addEventListener('click', async ()=>{
      collectMetaForm(root);
      await goToStudentsStep();
    });
  }
  const addRow = root.querySelector('#addRow');
  if(addRow){
    addRow.addEventListener('click', ()=>{
      const ex = currentExam;
      ex.entries.push({name:'', mark:null});
      render();
      setTimeout(()=>{
        const rows = document.querySelectorAll('#studentRows tr');
        const last = rows[rows.length-1];
        if(last){ const inp = last.querySelector('.s-name'); if(inp) inp.focus(); }
      },0);
    });
  }
  const backMeta = root.querySelector('#backMeta');
  if(backMeta){ backMeta.addEventListener('click', ()=>{ currentExam.step='meta'; render(); }); }

  root.querySelectorAll('[data-remove]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = Number(btn.dataset.remove);
      const ex = currentExam;
      ex.entries.splice(idx,1);
      render();
    });
  });

  root.querySelectorAll('#studentRows tr').forEach(tr=>{
    const idx = Number(tr.dataset.idx);
    const nameInput = tr.querySelector('.s-name');
    const markInput = tr.querySelector('.s-mark');
    if(nameInput){
      nameInput.addEventListener('input', ()=>{
        currentExam.entries[idx].name = nameInput.value;
      });
    }
    if(markInput){
      markInput.addEventListener('input', ()=>{
        const v = markInput.value;
        currentExam.entries[idx].mark = v==='' ? null : Number(v);
      });
    }
  });

  const submitBtn = root.querySelector('#submitExam');
  if(submitBtn){
    submitBtn.addEventListener('click', async ()=>{
      const ex = currentExam;
      ex.entries = ex.entries.filter(e=> e.name.trim()!=='');
      if(ex.entries.length===0){ showToast('অন্তত একজন শিক্ষার্থীর নাম দিন'); return; }
      submitBtn.disabled = true;
      submitBtn.textContent = 'সংরক্ষণ হচ্ছে...';
      const namesList = ex.entries.map(e=>e.name.trim());
      await saveStudents(ex.classKey, namesList);
      const ok = await saveExam(ex);
      if(ok){
        showToast('রেজাল্ট সফলভাবে সংরক্ষিত হয়েছে');
        navigateTo('result');
      } else {
        showToast('সংরক্ষণে সমস্যা হয়েছে, আবার চেষ্টা করুন');
        submitBtn.disabled=false;
        submitBtn.textContent='রেজাল্ট সাবমিট করুন';
      }
    });
  }
}

function formatBnDate(dateStr){
  if(!dateStr) return '';
  const [y,m,d] = dateStr.split('-');
  return toBnDigits(`${d}/${m}/${y}`);
}

// Extracts a natural "class, section, shift" sort order directly from the combined classKey
// text (e.g. "৩য়-শ্রেণি-ক-শাখা-সকাল"), so results list in a predictable row — ৩য়, ৪র্থ...১০ম,
// then ক,খ,গ,ঘ,ঙ within each class, then সকাল/বিকাল — instead of by upload time. This makes it
// easy to spot at a glance which class/section is still missing a result.
const CLASS_ORDINAL_ORDER = ['১ম','২য়','৩য়','৪র্থ','৫ম','৬ষ্ঠ','৭ম','৮ম','৯ম','১০ম','১১তম','১২তম'];
const SECTION_LETTER_ORDER = ['ক','খ','গ','ঘ','ঙ','চ','ছ','জ','ঝ','ঞ','ট','ঠ','ড','ঢ','ণ'];
const SHIFT_WORD_ORDER = ['সকাল','দুপুর','বিকাল','বিকেল','সন্ধ্যা','রাত'];
function classSortKey(classKeyText){
  const text = classKeyText || '';
  const tokens = text.split('-');
  let classRank = CLASS_ORDINAL_ORDER.findIndex(w => text.includes(w));
  if(classRank === -1) classRank = 999;
  let sectionRank = tokens.findIndex(t => SECTION_LETTER_ORDER.includes(t));
  sectionRank = sectionRank === -1 ? 999 : SECTION_LETTER_ORDER.indexOf(tokens[sectionRank]);
  let shiftRank = SHIFT_WORD_ORDER.findIndex(w => text.includes(w));
  if(shiftRank === -1) shiftRank = 999;
  return { classRank, sectionRank, shiftRank };
}
function compareByNaturalClassOrder(a, b){
  const ka = classSortKey(a.classKey), kb = classSortKey(b.classKey);
  if(ka.classRank !== kb.classRank) return ka.classRank - kb.classRank;
  if(ka.sectionRank !== kb.sectionRank) return ka.sectionRank - kb.sectionRank;
  if(ka.shiftRank !== kb.shiftRank) return ka.shiftRank - kb.shiftRank;
  return a.classKey.localeCompare(b.classKey, 'bn');
}

// Computes a table font-size (and matching cell padding) so that, whether there are
// 5 students or 60, the printed table fills roughly the same page height — few students
// means noticeably BIGGER text, not wasted blank space at the bottom of the page.
function computeDynamicTableStyle(rowCount){
  const targetTableHeightPx = 760; // approx. usable table-body height on one A4 page at our fixed 780px sheet width
  const effectiveRows = rowCount + 1; // + header row
  const rowHeightPx = targetTableHeightPx / effectiveRows;
  let fontPx = rowHeightPx / 2.15; // empirical: rowHeight ≈ fontSize * 2.15 given our padding/line-height
  // Capped at 18px (not the old 30px) — beyond that, names like "নাফিসা তাবাসসুম" no longer fit
  // on one line in the name column and wrap ugly. 18px still gives small classes noticeably
  // bigger, easier-to-read text without breaking the layout.
  fontPx = Math.max(9, Math.min(18, fontPx));
  const padV = Math.round(fontPx * 0.32);
  const padH = Math.round(fontPx * 0.42);
  return { fontPx: fontPx.toFixed(1), padV, padH };
}

function printSheetHtml(ex, ranking){
  const topMark = ranking.length && ranking[0].mark!==null ? toBnDigits(ranking[0].mark) : '';
  const rowCount = ranking.length || 1;
  const ts = computeDynamicTableStyle(rowCount);
  const rows = ranking.map((r,i)=>`
    <tr>
      <td>${toBnDigits(String(i+1).padStart(2,'0'))}</td>
      <td class="ps-name">${r.name}</td>
      <td>${r.mark!==null ? toBnDigits(r.mark) : 'অনুপস্থিত'}</td>
      <td>${toBnOrdinal(r.rank)}</td>
      ${i===0 ? `<td class="ps-top" rowspan="${rowCount}">${topMark}</td>` : ''}
    </tr>
  `).join('');

  const examTypeLabel = ex.examType || 'পরীক্ষার';
  const sectionLine = `${ex.cls}${ex.section ? ' ('+ex.section+')' : ''}${ex.batch ? ' — '+ex.batch : ''} শাখার ${examTypeLabel} ফলাফল`;

  return `
    <style>
      .ps-table th, .ps-table td{ font-size:${ts.fontPx}px !important; padding:${ts.padV}px ${ts.padH}px !important; }
      .ps-table td.ps-top{ font-size:${(ts.fontPx*2.2).toFixed(1)}px !important; }
    </style>
    <div class="ps-header-row">
      <img class="ps-logo" src="data:image/jpeg;base64,${LOGO_B64}" alt="logo"/>
      <div class="ps-titleblock">
        <h1>${SETTINGS.centerName}</h1>
        <p>${sectionLine}</p>
      </div>
      <div class="ps-logo-spacer"></div>
    </div>
    <div class="ps-meta">
      <span>বিষয়ঃ <b>${ex.subject}</b></span>
      <span>তারিখঃ <b>${formatBnDate(ex.date)}</b></span>
      <span>পূর্ণমানঃ <b>${toBnDigits(ex.fullMarks)}</b></span>
      <span>নিরীক্ষক:- <b>${ex.teacher}</b></span>
    </div>
    <table class="ps-table">
      <thead>
        <tr>
          <th style="width:70px;">ক্রমিক নং</th>
          <th>শিক্ষার্থীর নাম</th>
          <th style="width:110px;">প্রাপ্ত নাম্বার</th>
          <th style="width:110px;">মেধাস্থান</th>
          <th style="width:110px;">সর্বোচ্চ নম্বর</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="ps-footer">
      <div class="sig">
        <img class="ps-sign" src="data:image/png;base64,${SIGNATURE_B64}" alt="signature"/>
        <div class="sig-line">পরিচালক</div>
      </div>
    </div>
  `;
}

// Renders one exam's result sheet off-screen into the persistent #pdfSheet container and
// returns the rendered canvas. Works regardless of which view is currently on screen.
async function renderExamToCanvas(ex){
  const ranking = computeRanking(ex.entries);
  const sheet = document.getElementById('pdfSheet');
  sheet.innerHTML = printSheetHtml(ex, ranking);
  const prevStyle = sheet.getAttribute('style') || '';
  sheet.style.display = 'block';
  sheet.style.position = 'fixed';
  sheet.style.top = '0';
  sheet.style.left = '-10000px';
  sheet.style.width = '780px';
  sheet.style.background = '#ffffff';
  sheet.style.padding = '24px';
  sheet.style.zIndex = '-1';
  await new Promise(r=>setTimeout(r,60));
  const canvas = await html2canvas(sheet, {scale:2, backgroundColor:'#ffffff', useCORS:true});
  sheet.setAttribute('style', prevStyle);
  sheet.innerHTML = '';
  return canvas;
}

// Adds one exam's canvas to a jsPDF document, scaled to fit a single page.
function addExamCanvasToPdf(pdf, canvas, imgData, isFirstPageOfDoc){
  const pageWidth = pdf.internal.pageSize.getWidth();
  const pageHeight = pdf.internal.pageSize.getHeight();
  const ratio = Math.min((pageWidth-40)/canvas.width, (pageHeight-40)/canvas.height);
  const imgW = canvas.width*ratio;
  const imgH = canvas.height*ratio;
  if(!isFirstPageOfDoc) pdf.addPage();
  pdf.addImage(imgData, 'JPEG', (pageWidth-imgW)/2, 20, imgW, imgH);
}

async function downloadPDF(ex){
  try{
    const canvas = await renderExamToCanvas(ex);
    const imgData = canvas.toDataURL('image/jpeg', 0.95);
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p','pt','a4');
    addExamCanvasToPdf(pdf, canvas, imgData, true);
    // add a second, identical page — lets you print "2 pages per sheet" and cut once for 2 copies at half the paper cost
    addExamCanvasToPdf(pdf, canvas, imgData, false);
    const fname = `${filenameSafe(ex.cls)}_${filenameSafe(ex.examType)}_${filenameSafe(ex.subject)}_${ex.date}.pdf`.replace(/_+/g,'_');
    pdf.save(fname);
  }catch(err){
    console.error(err);
    showToast('PDF তৈরিতে সমস্যা হয়েছে, আবার চেষ্টা করুন');
  }
}

// Shares a result as a SINGLE-page JPG image (never the 2-page print/PDF version — that
// duplication is only meant for physical "2 pages per sheet" printing, not for sending to a
// parent over WhatsApp). Uses the native share sheet when available; falls back to just
// downloading the image if sharing files isn't supported, so it can be attached manually.
async function shareResultImage(ex){
  try{
    const canvas = await renderExamToCanvas(ex); // single page only, no duplication
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.92));
    if(!blob) throw new Error('canvas toBlob failed');
    const fname = `${filenameSafe(ex.cls)}_${filenameSafe(ex.examType)}_${filenameSafe(ex.subject)}_${ex.date}.jpg`.replace(/_+/g,'_');
    const file = new File([blob], fname, { type: 'image/jpeg' });
    const shareText = `${ex.cls}${ex.section ? ' ('+ex.section+')' : ''} — ${ex.subject} — ${formatBnDate(ex.date)} এর রেজাল্ট`;

    if(navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({ files: [file], title: 'রেজাল্ট', text: shareText });
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = fname;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      showToast('এই ব্রাউজারে সরাসরি শেয়ার সমর্থিত নয় — ছবিটা ডাউনলোড হয়েছে, WhatsApp-এ গিয়ে সংযুক্ত করে দিন');
    }
  }catch(err){
    if(err.name === 'AbortError') return; // person cancelled the share sheet — not an error
    console.error(err);

}

// Downloads every exam in examList as ONE combined PDF (each result still duplicated onto
// 2 pages for economical "2 pages per sheet" printing). Used for the date "folder" bulk-download.
// Downloads every exam in examList as a ZIP file containing one separate PDF per result
// (each PDF still duplicated onto 2 pages for economical "2 pages per sheet" printing).
async function downloadBulkPDF(examList, filenameBase, progressBtn){
  if(!examList.length){ showToast('কোনো রেজাল্ট নেই'); return; }
  try{
    const { jsPDF } = window.jspdf;
    const zip = new JSZip();
    const usedNames = new Set();
    for(let i=0;i<examList.length;i++){
      if(progressBtn) progressBtn.textContent = `তৈরি হচ্ছে (${i+1}/${examList.length})...`;
      const ex = examList[i];
      const canvas = await renderExamToCanvas(ex);
      const imgData = canvas.toDataURL('image/jpeg', 0.95);
      const pdf = new jsPDF('p','pt','a4');
      addExamCanvasToPdf(pdf, canvas, imgData, true);
      addExamCanvasToPdf(pdf, canvas, imgData, false);
      const blob = pdf.output('blob');
      const baseName = `${filenameSafe(ex.cls)}_${filenameSafe(ex.examType)}_${filenameSafe(ex.subject)}_${ex.date}`.replace(/_+/g,'_');
      let finalName = baseName, n = 1;
      while(usedNames.has(finalName)){ n++; finalName = `${baseName}_${n}`; }
      usedNames.add(finalName);
      zip.file(`${finalName}.pdf`, blob);
    }
    if(progressBtn) progressBtn.textContent = 'ZIP তৈরি হচ্ছে...';
    const zipBlob = await zip.generateAsync({type:'blob'});
    const url = URL.createObjectURL(zipBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${filenameBase}.zip`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast('ZIP ডাউনলোড সম্পন্ন হয়েছে');
  }catch(err){
    console.error(err);
    showToast('ZIP তৈরিতে সমস্যা হয়েছে, আবার চেষ্টা করুন');

  }
}

function parseExamKey(key){
  const raw = key.replace(/^exam:/,'');
  if(raw.includes('__')){
    // newer format: {classKey}__{examType}__{subject}__{date}__{timestamp}
    const parts = raw.split('__');
    const ts = parts.pop();
    const date = parts.pop();
    const subject = parts.pop();
    const examType = parts.pop();
    const classKey = parts.join('__');
    return {key, classKey, examType, subject, date, ts};
  }
  // legacy format (saved before exam-type existed): {classKey}_{subject}_{date}_{timestamp}
  const parts = raw.split('_');
  const ts = parts.pop();
  const date = parts.pop();
  const subject = parts.pop();
  const classKey = parts.join('_');
  return {key, classKey, examType:'', subject, date, ts};
}

let ADMIN_CACHE = null; // { parsed: [...] } — flat, sorted newest-first; refreshed by renderAdminInto
let GROUP_MODE = 'date'; // 'date' | 'examtype' — which way the results list is currently grouped

// Fetches the exam key list fresh from the server, caches it, and renders the (unfiltered) list.
// Used for the initial admin view load and after deleting/editing an item.
async function renderAdminInto(host, searchTerm){
  host.innerHTML = '<p class="muted">লোড হচ্ছে...</p>';
  const keys = await listExamKeys();
  if(!keys.length){
    ADMIN_CACHE = { parsed: [] };
    host.innerHTML = `<p class="empty">এখনো কোনো রেজাল্ট সংরক্ষিত হয়নি।</p>`;
    return;
  }
  const parsed = keys.map(parseExamKey).sort((a,b)=> Number(b.ts)-Number(a.ts));
  ADMIN_CACHE = { parsed };
  renderAdminList(host, searchTerm || '');
}

// Renders the folder list from ADMIN_CACHE, grouped by GROUP_MODE (date or exam type) and
// filtered by searchTerm (matches class/section/batch, subject, exam type, or the DD-MM-YYYY
// date string). Pure client-side — no network call, so it's instant as the person types or
// switches grouping mode.
function renderAdminList(host, searchTerm){
  if(!ADMIN_CACHE){ return; }
  const { parsed } = ADMIN_CACHE;
  if(!parsed.length){
    host.innerHTML = `<p class="empty">এখনো কোনো রেজাল্ট সংরক্ষিত হয়নি।</p>`;
    return;
  }
  const term = (searchTerm||'').trim().toLowerCase();
  const filtered = term
    ? parsed.filter(p=>{
        const dateLabelAscii = (()=>{ const [y,m,d]=p.date.split('-'); return `${d}-${m}-${y}`; })();
        return p.classKey.replace(/-/g,' ').toLowerCase().includes(term) ||
          p.subject.toLowerCase().includes(term) ||
          (p.examType||'').toLowerCase().includes(term) ||
          dateLabelAscii.includes(term);
      })
    : parsed;

  host.innerHTML = '';
  if(term && filtered.length===0){
    host.innerHTML = `<p class="empty">"${searchTerm}" এর সাথে মিলে এমন কোনো রেজাল্ট পাওয়া যায়নি।</p>`;
    return;
  }

  // group
  const groups = new Map(); // groupKey -> items[]
  filtered.forEach(p=>{
    const gKey = GROUP_MODE === 'date' ? p.date : (p.examType || 'পরীক্ষার ধরন উল্লেখ নেই');
    if(!groups.has(gKey)) groups.set(gKey, []);
    groups.get(gKey).push(p);
  });

  // order the groups
  let groupKeys;
  if(GROUP_MODE === 'date'){
    groupKeys = Array.from(groups.keys()).sort((a,b)=> a<b ? 1 : -1); // newest date first
  } else {
    // most recently active exam-type first (by the newest item's timestamp within each group)
    groupKeys = Array.from(groups.keys()).sort((a,b)=>{
      const maxA = Math.max(...groups.get(a).map(p=>Number(p.ts)));
      const maxB = Math.max(...groups.get(b).map(p=>Number(p.ts)));
      return maxB - maxA;
    });
  }

  groupKeys.forEach((gKey, idx)=>{
    const itemsForGroup = groups.get(gKey).slice().sort(compareByNaturalClassOrder);
    const folderLabel = GROUP_MODE === 'date' ? formatBnDate(gKey) : gKey;
    const bulkFilenameBase = GROUP_MODE === 'date' ? `Results-${gKey}` : `Results-${filenameSafe(gKey)}`;

    const folder = el(`
      <details class="date-folder" ${ (term || idx===0) ? 'open' : '' }>
        <summary>
          <span><b>${folderLabel}</b> — ${toBnDigits(itemsForGroup.length)}টি রেজাল্ট</span>
          <button class="btn small secondary" data-bulk-group>সব ডাউনলোড (ZIP)</button>
        </summary>
        <div class="folder-body"></div>
      </details>
    `);
    const body = folder.querySelector('.folder-body');
    itemsForGroup.forEach(p=>{
      // edit: teacher or admin. delete: admin only (teachers never see the delete button).
      const actionButtons = isLoggedIn()
        ? `<button class="btn small secondary" data-edit-key="${p.key}" title="এডিট করুন">✎ এডিট</button>
           ${isAdmin() ? `<button class="btn small danger" data-del-key="${p.key}" title="মুছে ফেলুন">✕ মুছুন</button>` : ''}`
        : '';
      const dateTag = GROUP_MODE === 'examtype' ? `<span class="tag">${formatBnDate(p.date)}</span>` : '';
      const item = el(`
        <div class="exam-list-item" data-key="${p.key}">
          <div>
            <div>${dateTag}<span class="tag">${p.classKey.replace(/-/g,' ')}</span>${(p.examType && GROUP_MODE==='date') ? `<span class="tag">${p.examType}</span>` : ''}<b>${p.subject}</b></div>
          </div>
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
            <span class="muted" style="font-size:13px;">দেখুন / প্রিন্ট →</span>
            ${actionButtons}
          </div>
        </div>
      `);
      item.addEventListener('click', async (evt)=>{
        if(evt.target.closest('[data-del-key]') || evt.target.closest('[data-edit-key]')) return;
        const id = p.key.replace(/^exam:/,'');
        const data = await getExam(id);
        if(data){
          navigateTo('result', { exam: data });
        } else {
          showToast('রেজাল্ট লোড করা যায়নি');
        }
      });
      const editBtn = item.querySelector('[data-edit-key]');
      if(editBtn){
        editBtn.addEventListener('click', async (evt)=>{
          evt.stopPropagation();
          const ok = await requireLogin();
          if(!ok) return;
          const id = p.key.replace(/^exam:/,'');
          const data = await getExam(id);
          if(!data){ showToast('রেজাল্ট লোড করা যায়নি'); return; }
          data.editing = true;
          data.step = 'meta';
          navigateTo('entry', { exam: data });
        });
      }
      const delBtn = item.querySelector('[data-del-key]');
      if(delBtn){
        delBtn.addEventListener('click', async (evt)=>{
          evt.stopPropagation();
          const ok = await requireAdmin();
          if(!ok) return;
          const sure = confirm(`নিশ্চিত? এই রেজাল্টটি (${p.classKey.replace(/-/g,' ')} — ${p.subject} — ${p.date}) স্থায়ীভাবে মুছে যাবে।`);
          if(!sure) return;
          const id = p.key.replace(/^exam:/,'');
          const success = await deleteExam(id);
          if(success){
            showToast('রেজাল্ট মুছে ফেলা হয়েছে');
            renderAdminInto(host, term);
          } else {
            showToast('মুছতে সমস্যা হয়েছে, আবার চেষ্টা করুন');
          }
        });
      }
      body.appendChild(item);
    });

    const bulkBtn = folder.querySelector('[data-bulk-group]');
    bulkBtn.addEventListener('click', async (evt)=>{
      evt.preventDefault();  // stop the <details> from toggling open/closed
      evt.stopPropagation();
      bulkBtn.disabled = true;
      const orig = bulkBtn.textContent;
      const exams = [];
      for(const p of itemsForGroup){
        const data = await getExam(p.key.replace(/^exam:/,''));
        if(data) exams.push(data);
      }
      await downloadBulkPDF(exams, bulkFilenameBase, bulkBtn);
      bulkBtn.disabled = false;
      bulkBtn.textContent = orig;
    });

    host.appendChild(folder);
  });
}

// ---- grading logic ----
function mtGpFromPercent(pct){
  if(pct >= 80) return 5;
  if(pct >= 70) return 4;
  if(pct >= 60) return 3.5;
  if(pct >= 50) return 3;
  if(pct >= 40) return 2;
  if(pct >= 33) return 1;
  return 0;
}
function mtGradeLabelFromGp(gp){
  if(gp === 5) return 'A+';
  if(gp === 4) return 'A';
  if(gp === 3.5) return 'A-';
  if(gp === 3) return 'B';
  if(gp === 2) return 'C';
  if(gp === 1) return 'D';
  return 'F';
}
function mtOverallGradeFromGpa(gpa, anyZeroGp){
  if(anyZeroGp) return 'F';
  if(gpa >= 5) return 'A+';
  if(gpa >= 4) return 'A';
  if(gpa >= 3.5) return 'A-';
  if(gpa >= 3) return 'B';
  if(gpa >= 2) return 'C';
  if(gpa >= 1) return 'D';
  return 'F';
}

  `, (root, close)=>{
    const $ = (q)=> root.querySelector(q);
    $('#etCancel').addEventListener('click', ()=> close(null));
    $('#etSave').addEventListener('click', ()=>{
      const n = $('#etName').value.trim(), c = $('#etClass').value.trim();
      if(!n || !c){ $('#etMsg').textContent = 'পরীক্ষার নাম ও শ্রেণি দুটোই দিন'; return; }
      sheet.examName = n; sheet.className = c;
      const inIndex = MT_SHEETS.find(x=> x.id === sheet.id);
      if(inIndex){ inIndex.examName = n; inIndex.className = c; }
      close(true);
    });
    root.querySelectorAll('input').forEach(i=> i.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') $('#etSave').click(); }));
    $('#etName').focus();
  });
  if(!ok) return false;
  await mtSaveSheetsIndex();
  showToast('শিরোনাম পরিবর্তন হয়েছে');
  return true;
}

// A sheet is "final" once the admin has pressed "ফাইনাল করুন". Until then the students stay in the order
// they were entered (attendance serial) so every room's sheet can be checked line by line.
// Sheets made before this feature have no flag → they count as final, so nothing changes for them.
function mtIsFinal(sheet){ return !sheet || sheet.finalized !== false; }
async function mtSetFinalized(sheet, value){
  sheet.finalized = value;
  const inIndex = MT_SHEETS.find(x=> x.id === sheet.id);
  if(inIndex) inIndex.finalized = value;
  await mtSaveSheetsIndex();
}

function mtDenseRank(items, valueFn){
  const sorted = items.slice().sort((a,b)=> valueFn(b) - valueFn(a));
  let rank = 0, prevVal = null;
  return sorted.map(item=>{
    const v = valueFn(item);
    if(prevVal === null || v !== prevVal) rank++;
    prevVal = v;
    return Object.assign({}, item, { position: rank });
  });
}

// ---- main render dispatcher for this module ----
function renderMT(){
  if(['admin','admin-sheet','entry'].includes(MT_VIEW) && !isLoggedIn()) MT_VIEW = 'public-select'; // safety net
  if(MT_VIEW === 'landing'){   // there is no separate login/landing screen any more
    MT_VIEW = isLoggedIn() ? 'admin' : 'public-select';
    if(!MT_SHEETS.length) mtLoadSheetsIndex().then(()=>{ if(VIEW==='mt') render(); });

  if(MT_VIEW === 'landing'){ const inner = mtRenderLanding(); wrap.appendChild(inner); mtAttachLandingEvents(inner); }
  else if(MT_VIEW === 'admin') wrap.appendChild(mtRenderAdminDashboard());
  else if(MT_VIEW === 'admin-sheet') wrap.appendChild(mtRenderAdminSheet());
  else if(MT_VIEW === 'public-select') wrap.appendChild(mtRenderPublicSelect());
  else if(MT_VIEW === 'entry') wrap.appendChild(mtRenderEntry());
  else if(MT_VIEW === 'result') wrap.appendChild(mtRenderResultView());

}

  // Reads whatever is currently typed into the subject rows back into MT_SUBJECTS. This MUST run
  // before add/remove triggers a re-render — otherwise any not-yet-saved edits in the other rows
  // get thrown away and overwritten by the stale array, which is exactly the "subjects disappear"
  // bug: adding or removing a row used to rebuild the table straight from MT_SUBJECTS without ever
  // capturing what was currently on screen first.
  function mtSyncSubjectRowsFromDom(){
    wrap.querySelectorAll('#mtSubjectRows tr').forEach(tr=>{

    MT_SUBJECTS.push({ id: mtNewSubjectId(), name:'', fullMarks:100 });
    render();
  });

    btn.addEventListener('click', ()=>{
      mtSyncSubjectRowsFromDom();
      MT_SUBJECTS.splice(Number(btn.dataset.removeSubject), 1);
      render();
    });
  });
  wrap.querySelectorAll('[data-enter-subject]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      mtSyncSubjectRowsFromDom();

      if(!subj) return;
      MT_SUBJECT = subj;

      MT_ENTRIES = MT_STUDENTS.map(n=>({ name:n, orig:n, mark: (marks[n]!==undefined ? marks[n] : null) }));

  wrap.querySelector('#mtSaveSubjectsBtn').addEventListener('click', async ()=>{

    await mtSaveSubjects(sheet.id, MT_SUBJECTS);
    showToast('সাবজেক্ট তালিকা সংরক্ষিত হয়েছে');
    render();
  });
  return wrap;
}

    if(new Set(names).size !== names.length){
      btn.disabled = false; btn.textContent = orig;
      showToast('একই নামে একাধিক শিক্ষার্থী আছে — নাম আলাদা করুন (যেমন নামের শেষে রোল লিখুন)');
      return;
    }
    // renamed students: move their marks in ALL the other subjects to the new name, otherwise those marks get lost
    const renameMap = new Map(MT_ENTRIES.filter(e=> e.orig && e.orig !== e.name.trim()).map(e=> [e.orig, e.name.trim()]));
    let carryOk = true;
    if(renameMap.size){
      for(const sub of MT_SUBJECTS){
        if(sub.id === MT_SUBJECT.id) continue;
        const old = await mtLoadMarks(MT_SHEET.id, sub.id);
        if(!Array.from(renameMap.keys()).some(k=> Object.prototype.hasOwnProperty.call(old, k))) continue;
        const moved = {};
        for(const k of Object.keys(old)) moved[renameMap.has(k) ? renameMap.get(k) : k] = old[k];
        if(!(await mtSaveMarks(MT_SHEET.id, sub.id, moved))) carryOk = false;
      }
    }
    await mtSaveStudents(MT_SHEET.id, names);
    MT_STUDENTS = names;
    const marksObj = {};
    MT_ENTRIES.forEach(e=>{ marksObj[e.name.trim()] = (e.mark===null || e.mark===undefined) ? null : e.mark; });
    const ok = await mtSaveMarks(MT_SHEET.id, MT_SUBJECT.id, marksObj);
    btn.disabled = false;
    btn.textContent = orig;
    MT_ENTRIES.forEach(e=>{ e.orig = e.name.trim(); }); // saved — future renames start from the new names
    if(ok && !carryOk) showToast('নাম বদলের সময় অন্য সাবজেক্টের নম্বর সরাতে সমস্যা হয়েছে, আবার সংরক্ষণ করে দেখুন');
    else if(ok) showToast('নম্বর সংরক্ষিত হয়েছে');
    else showToast('সংরক্ষণে সমস্যা হয়েছে, আবার চেষ্টা করুন');
  });
  return wrap;
}

// ---------- Merit list / result sheet (read-only, computed) ----------
async function mtComputeResult(sheet){
  const subjects = await mtLoadSubjects(sheet.id);
  const students = await mtLoadStudents(sheet.id);
  const marksBySubject = {};
  for(const sub of subjects){
    marksBySubject[sub.id] = await mtLoadMarks(sheet.id, sub.id);
  }
  const rows = students.map((name, idx)=>{
    let total = 0, gpaSum = 0, anyZeroGp = false;
    const perSubject = subjects.map(sub=>{
      const mark = marksBySubject[sub.id] ? marksBySubject[sub.id][name] : null;
      const numMark = (mark===null || mark===undefined || mark==='') ? 0 : Number(mark);
      const pct = sub.fullMarks > 0 ? (numMark/sub.fullMarks)*100 : 0;
      const gp = mtGpFromPercent(pct);
      if(gp === 0) anyZeroGp = true;
      total += numMark;
      gpaSum += gp;
      return { subjectId: sub.id, mark: (mark===null||mark===undefined||mark==='') ? null : numMark, gp };
    });
    const gpa = subjects.length ? gpaSum / subjects.length : 0;
    const grading = mtOverallGradeFromGpa(gpa, anyZeroGp);
    return { name, serial: idx + 1, perSubject, total, gpa, grading };
  });
  const ranked = mtDenseRank(rows, r=>r.total);   // positions are always worked out…
  const finalized = mtIsFinal(sheet);
  // …but the ORDER only becomes merit order after "ফাইনাল করুন". Before that: entry (serial) order.
  ranked.sort(finalized ? (a,b)=> (a.position - b.position) || (a.serial - b.serial)
                        : (a,b)=> a.serial - b.serial);
  return { subjects, students, rows: ranked, finalized };
}

// Builds the merit-list table HTML. forPrint=false renders normal on-screen sizing (scrolls
// horizontally if many subjects); forPrint=true is used inside the off-screen PDF canvas capture.
function mtResultTableHtml(sheet, data, forPrint){
  const { subjects, rows } = data;
  const fullMarksTotal = subjects.reduce((s,x)=> s + Number(x.fullMarks||0), 0);
  const headerCells = subjects.map(s=>`<th colspan="2">${s.name}</th>`).join('');
  const subHeaderCells = subjects.map(()=>`<th>নম্বর</th><th>GP</th>`).join('');
  // While the sheet is still being checked (not final), anything not entered yet stays EMPTY — no dashes,
  // no zeros/F — so it is obvious what is still missing. After "ফাইনাল করুন" the normal look returns.
  const checking = !mtIsFinal(sheet);
  const offset = data.offset || 0;   // page 2 of the PDF continues the serial (33, 34, …) instead of restarting at 1
  const bodyRows = rows.map((r,i)=>{
    const noneEntered = r.perSubject.every(p=> p.mark === null);
    const blankSummary = checking && noneEntered;
    const subjCells = r.perSubject.map(p=>{
      if(p.mark === null) return checking ? `<td></td><td></td>` : `<td>—</td><td>০</td>`;
      return `<td>${toBnDigits(p.mark)}</td><td>${toBnDigits(p.gp)}</td>`;
    }).join('');
    return `
      <tr>
        <td>${toBnDigits(offset + i + 1)}</td>
        <td style="text-align:left;">${r.name}</td>
        ${subjCells}
        <td>${blankSummary ? '' : toBnDigits(r.total)}</td>
        <td>${blankSummary ? '' : toBnDigits(r.gpa.toFixed(2))}</td>
        <td>${blankSummary ? '' : r.grading}</td>
        <td>${blankSummary ? '' : toBnDigits(r.position)}</td>
      </tr>
    `;
  }).join('');
  const tableClass = forPrint ? 'ps-table' : '';
  return `
    ${forPrint ? `
    <div class="ps-header-row">
      <img class="ps-logo" src="data:image/jpeg;base64,${LOGO_B64}" alt="logo"/>
      <div class="ps-titleblock">
        <h1>${SETTINGS.centerName}</h1>
        <p>${sheet.examName} — Class:- ${sheet.className} — Full Marks:- ${toBnDigits(fullMarksTotal)}</p>
      </div>
      <div class="ps-logo-spacer"></div>
    </div>` : ''}
    <div style="overflow-x:auto;">
    <table class="${tableClass}" style="min-width:${forPrint?'auto':'900px'};">
      <thead>
        <tr><th rowspan="2">ক্রম</th><th rowspan="2">শিক্ষার্থীর নাম</th>${headerCells}<th rowspan="2">T.Marks</th><th rowspan="2">GPA</th><th rowspan="2">Grading</th><th rowspan="2">Position</th></tr>
        <tr>${subHeaderCells}</tr>
      </thead>
      <tbody>${bodyRows}</tbody>
    </table>
    </div>
    ${forPrint ? `<p style="margin-top:16px;font-size:18px;font-weight:700;text-align:center;">মার্কের ভিত্তিতে মেধাস্থান নির্ধারণ করা হয়েছে।</p>` : ''}
  `;
}

// Multi-page PDF: chunks students into pages of 32 rows, repeating the full header+column
// titles on every page (per the spec — mobile browsers don't repeat table headers on their own).
// Picks a canvas width that roughly matches how wide the table actually is (based on how many
// subjects it has) instead of always using a fixed wide canvas — with few subjects, a fixed-wide
// canvas left a lot of empty space next to the table, which made the header's logo look like it
// had drifted off to one side relative to the (much narrower) table below it.
function mtComputeContainerWidth(subjectCount){
  return Math.min(1400, Math.max(750, 550 + subjectCount*140));
}

// Renders one chunk (page) of the merit list to an off-screen canvas. Shared by both the PDF
// download and the WhatsApp/share function so they always produce identical-looking pages.
async function mtRenderChunkToCanvas(sheet, subjects, chunkRows, offset){
  const sheetEl = document.getElementById('mtPdfSheet');
  const chunkData = { subjects, rows: chunkRows, offset: offset || 0 };
  sheetEl.innerHTML = mtResultTableHtml(sheet, chunkData, true);
  const prevStyle = sheetEl.getAttribute('style') || '';
  sheetEl.style.display = 'block';
  sheetEl.style.position = 'fixed';
  sheetEl.style.top = '0';
  sheetEl.style.left = '-10000px';
  sheetEl.style.width = mtComputeContainerWidth(subjects.length) + 'px';
  sheetEl.style.background = '#ffffff';
  sheetEl.style.padding = '24px';
  sheetEl.style.zIndex = '-1';
  await new Promise(r=>setTimeout(r,60));
  const canvas = await html2canvas(sheetEl, { scale:2, backgroundColor:'#ffffff', useCORS:true });
  sheetEl.setAttribute('style', prevStyle);
  sheetEl.innerHTML = '';
  return canvas;
}

async function mtBuildResultPdf(sheet, data){
  const ROWS_PER_PAGE = 32;
  const { subjects, rows } = data;
  const chunks = [];
  for(let i=0;i<rows.length;i+=ROWS_PER_PAGE){ chunks.push(rows.slice(i, i+ROWS_PER_PAGE)); }
  if(!chunks.length) chunks.push([]);

  // Pass 1: draw every page (serial numbers continue: page 2 starts at 33).
  const shots = [];
  for(let c=0;c<chunks.length;c++){
    const canvas = await mtRenderChunkToCanvas(sheet, subjects, chunks[c], c * ROWS_PER_PAGE);
    shots.push({ img: canvas.toDataURL('image/jpeg', 0.95), w: canvas.width, h: canvas.height });
  }

  // Pass 2: ONE common scale for every page, and the paper orientation that makes the table biggest.
  // (Scaling each page on its own made the full 32-row pages shrink to fit the height while a short last page
  //  stayed big — pages looked different sizes. A 32-row table is tall, so with few subjects portrait A4 fits it
  //  much larger than landscape; with many subject columns it is wide and landscape wins.)
  const A4 = { l: [842, 595], p: [595, 842] };
  const fit = (o)=> Math.min(...shots.map(sh=> Math.min((A4[o][0]-40)/sh.w, (A4[o][1]-40)/sh.h)));
  const orient = fit('p') > fit('l') ? 'p' : 'l';
  const ratio = fit(orient);

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF(orient, 'pt', 'a4');
  const pageWidth = pdf.internal.pageSize.getWidth();
  shots.forEach((sh, idx)=>{
    if(idx > 0) pdf.addPage();
    const imgW = sh.w * ratio, imgH = sh.h * ratio;
    pdf.addImage(sh.img, 'JPEG', (pageWidth-imgW)/2, 20, imgW, imgH);
  });
  return pdf;
}

async function mtDownloadResultPdf(sheet, data){
  try{
    const pdf = await mtBuildResultPdf(sheet, data);
    const fname = `${filenameSafe(sheet.examName)}_${filenameSafe(sheet.className)}_merit-list.pdf`.replace(/_+/g,'_');
    pdf.save(fname);
    showToast('PDF ডাউনলোড সম্পন্ন হয়েছে');
  }catch(err){
    console.error(err);
    showToast('PDF তৈরিতে সমস্যা হয়েছে, আবার চেষ্টা করুন');
  }
}

// Shares the merit-list result as a PDF (not JPG, since it can be multiple pages — unlike the
// weekly single-page result, which shares as a single JPG image instead).
async function mtShareResultPdf(sheet, data){
  try{
    const pdf = await mtBuildResultPdf(sheet, data);
    const blob = pdf.output('blob');
    const fname = `${filenameSafe(sheet.examName)}_${filenameSafe(sheet.className)}_merit-list.pdf`.replace(/_+/g,'_');
    const file = new File([blob], fname, { type: 'application/pdf' });
    const shareText = `${sheet.examName} — ${sheet.className} এর ফলাফল`;

    if(navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({ files: [file], title: 'মডেল টেস্ট ফলাফল', text: shareText });
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = fname;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      showToast('এই ব্রাউজারে সরাসরি শেয়ার সমর্থিত নয় — PDF ডাউনলোড হয়েছে, WhatsApp-এ গিয়ে সংযুক্ত করে দিন');
    }
  }catch(err){
    if(err.name === 'AbortError') return;
    console.error(err);
    showToast('শেয়ার করতে সমস্যা হয়েছে, আবার চেষ্টা করুন');

  }
}

// It lives in its own file (certificate.html) and opens full-screen on top of the result sheet,
// already filled with the students of that result. The admin password is checked here (requireAdmin)
// AND again inside certificate.html, so the page can't be used by teachers or visitors.

const CERT_PAGE = 'certificate.html';

// Asks "up to which merit position should get a certificate?". Positions (not a head-count) are used so
// that students who tie on the same position are never split up. Resolves to a number, or null if cancelled.
function askCertificateScope(items){
  const maxPos = Math.max(...items.map(i=> Number(i.pos)));
  const countUpTo = (n)=> items.filter(i=> Number(i.pos) <= n).length;
  const startN = Math.min(3, maxPos);
  return openModal(`
    <h3>সার্টিফিকেট তৈরি</h3>
    <p class="muted">মেধাস্থান অনুযায়ী কত নম্বর স্থান পর্যন্ত সার্টিফিকেট দেবেন? যেমন ৩ দিলে ১ম, ২য় ও ৩য় — এই তিন স্থানের সবাই আসবেন (একই স্থানে একাধিক জন থাকলে সবাই)।</p>
    <div class="row-actions" style="margin:0 0 12px;">
      <button class="btn small secondary" data-n="1">শুধু ১ম</button>
      <button class="btn small secondary" data-n="3">৩য় পর্যন্ত</button>
      <button class="btn small secondary" data-n="5">৫ম পর্যন্ত</button>
      <button class="btn small secondary" data-n="${maxPos}">সবাই</button>
    </div>
    <div class="field"><label>কত নম্বর স্থান পর্যন্ত</label><input type="number" id="csN" min="1" max="${maxPos}" value="${startN}"/></div>
    <p class="muted" id="csCount" style="margin-top:-6px;"></p>
    <div class="modal-msg" id="csMsg"></div>
    <div class="row-actions" style="margin-top:0;">
      <button class="btn" id="csGo">সার্টিফিকেট জেনারেটর খুলুন</button>
      <button class="btn secondary" id="csCancel">বাতিল</button>
    </div>
  `, (root, close)=>{
    const input = root.querySelector('#csN');
    const countEl = root.querySelector('#csCount');
    const paint = ()=>{
      const n = parseInt(input.value, 10);
      countEl.textContent = (n >= 1) ? `${toBnDigits(countUpTo(Math.min(n, maxPos)))} জনের সার্টিফিকেট তৈরি হবে` : '';
    };
    input.addEventListener('input', paint);
    root.querySelectorAll('[data-n]').forEach(b=> b.addEventListener('click', ()=>{
      input.value = Math.min(maxPos, Number(b.dataset.n));
      paint();
    }));
    root.querySelector('#csCancel').addEventListener('click', ()=> close(null));
    root.querySelector('#csGo').addEventListener('click', ()=>{
      const n = parseInt(input.value, 10);
      if(!(n >= 1)){ root.querySelector('#csMsg').textContent = '১ বা তার বেশি একটা সংখ্যা দিন'; return; }
      close(Math.min(n, maxPos));
    });
    input.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') root.querySelector('#csGo').click(); });
    paint();
  });
}

// items: [{name, cls, marks, pos, grade}] — only students who actually have a merit position.
async function startCertificateGenerator(items, eventLabel){
  if(!(await requireAdmin())) return;
  if(!items.length){ showToast('সার্টিফিকেট দেওয়ার মতো কোনো শিক্ষার্থী নেই'); return; }
  const cutoff = await askCertificateScope(items);
  if(cutoff === null) return;
  const chosen = items.filter(i=> Number(i.pos) <= cutoff);
  const payload = {
    students: chosen.map(i=>({
      name: i.name,
      cls: i.cls || '',
      roll: '',
      marks: (i.marks === null || i.marks === undefined) ? '' : String(i.marks),
      pos: String(i.pos),
      grade: i.grade || ''
    })),
    event: eventLabel || '',
    inst: SETTINGS.centerName
  };
  try{ sessionStorage.setItem('rs.certImport', JSON.stringify(payload)); }
  catch(e){ showToast('এই ব্রাউজারে সার্টিফিকেট জেনারেটর খোলা যাচ্ছে না'); return; }
  openCertificateOverlay();
}

// Weekly result → certificates (name, class, marks and merit position come straight from the result sheet)
function startCertificateFromExam(ex){
  if(!ex) return;
  const cls = `${ex.cls || ''}${ex.section ? ' ('+ex.section+')' : ''}`.trim();
  const items = computeRanking(ex.entries)
    .filter(r=> r.rank !== null)
    .map(r=> ({ name: r.name, cls, marks: r.mark, pos: r.rank, grade: '' }));
  const eventLabel = [ex.examType, ex.subject].filter(Boolean).join(' — ');
  startCertificateGenerator(items, eventLabel);
}

// Model Test merit list → certificates (total marks, GPA grade and merit position from the sheet)
function startCertificateFromMT(sheet, data){
  if(!sheet || !data) return;
  if(!data.finalized){ showToast('আগে ফলাফল "ফাইনাল করুন", তারপর সার্টিফিকেট তৈরি করুন'); return; }
  const items = data.rows.map(r=> ({ name: r.name, cls: sheet.className, marks: r.total, pos: r.position, grade: r.grading }));
  startCertificateGenerator(items, sheet.examName);
}

function openCertificateOverlay(){
  if(document.getElementById('certOverlay')) return;
  const ov = el(`
    <div class="cert-overlay" id="certOverlay">
      <div class="cert-bar">
        <button class="btn small secondary" id="certBack">← ফিরে যান</button>
        <b>সার্টিফিকেট জেনারেটর</b>
      </div>
      <iframe src="${CERT_PAGE}" title="সার্টিফিকেট জেনারেটর"></iframe>
    </div>
  `);
  document.body.appendChild(ov);
  document.body.style.overflow = 'hidden';
  // one history entry, so the phone/browser back button closes the generator instead of leaving the app
  history.pushState({ view: VIEW, examId: (VIEW === 'result' && currentExam) ? currentExam.id : null, cert: true }, '', '#certificate');
  ov.querySelector('#certBack').addEventListener('click', ()=> history.back());
  // admin-only check: warn if certificate.html on the server is an older/newer upload than index.html
  ov.querySelector('iframe').addEventListener('load', ()=>{
    try{
      const v = ov.querySelector('iframe').contentWindow.__CERT_VERSION;
      if(v !== APP_VERSION) showToast(`সতর্কতা: certificate.html (${v||'পুরনো'}) আর index.html (${APP_VERSION}) একই ভার্সনের নয় — দুটো ফাইলই আবার আপলোড করুন`);
    }catch(e){}
  });
}
function closeCertificateOverlay(){
  const ov = document.getElementById('certOverlay');
  if(ov) ov.remove();
  document.body.style.overflow = '';
}

async function init(){
  setRole(null); // login is session-only — a reload/reopen always starts logged out
  const app = document.getElementById('app');
  app.innerHTML = `<div style="text-align:center;padding:60px 10px;color:var(--muted);">লোড হচ্ছে...</div>`;
  await Promise.all([loadSettings(), loadFormMeta()]);
  history.replaceState({ view: 'home' }, '', '#home'); // establish the starting point for back/forward
  render();
}

const origRender = render;
render = function(){
  origRender();
  const app = document.getElementById('app');
  attachHomeEvents(app);
  attachEntryEvents(app);
  attachResultEvents(app);
};

init();

// Register the service worker so Chrome/Edge offer an "Install app" option — safe to skip
// silently if the browser doesn't support it or the file isn't reachable (e.g. opened locally
// as a plain file instead of via the live GitHub Pages link).
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{ /* not fatal — app still works normally */ });
  });
}
</script>
